<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo + ' | Monate Estoque'}">Produto | Monate Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/monate.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-wrap form-page">
    <a class="back-link" th:href="@{/produtos}">← Voltar para produtos</a>
    <div class="form-heading">
        <p class="eyebrow">INFORMAÇÕES DO PRODUTO</p>
        <h1 th:text="${titulo}">Novo produto</h1>
        <p class="subtitle">Preencha os campos abaixo para manter seu estoque atualizado.</p>
    </div>

    <section class="content-card form-card">
        <form th:object="${form}" th:action="${acao}" method="post">
            <div class="mb-4">
                <label for="nome" class="form-label">Nome do produto</label>
                <input id="nome" type="text" class="form-control form-control-lg" th:field="*{nome}"
                       placeholder="Ex.: Brownie tradicional" maxlength="80" required>
                <div class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro no nome</div>
            </div>
            <div class="mb-4">
                <label for="categoria" class="form-label">Categoria</label>
                <input id="categoria" type="text" class="form-control" th:field="*{categoria}"
                       placeholder="Ex.: Doces, bebidas, embalagens" maxlength="40" required>
                <div class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">Erro na categoria</div>
            </div>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="preco" class="form-label">Preço de venda (R$)</label>
                    <input id="preco" type="number" class="form-control" th:field="*{preco}"
                           min="0.01" step="0.01" placeholder="0,00" required>
                    <div class="field-error" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">Erro no preço</div>
                </div>
                <div class="col-md-6">
                    <label for="estoque" class="form-label">Quantidade em estoque</label>
                    <input id="estoque" type="number" class="form-control" th:field="*{estoque}"
                           min="0" step="1" placeholder="0" required>
                    <div class="form-hint">Use 0 quando o produto estiver esgotado.</div>
                    <div class="field-error" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}">Erro no estoque</div>
                </div>
            </div>
            <div class="form-footer">
                <a class="btn btn-light-outline" th:href="@{/produtos}">Cancelar</a>
                <button class="btn btn-monate" type="submit">Salvar produto</button>
            </div>
        </form>
    </section>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
