spring.application.name=monate-estoque

# Ambiente local: configure seu MySQL no IntelliJ ou use os valores padrao abaixo.
# Publicacao: configure as tres variaveis SPRING_DATASOURCE_* no Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/monate_estoque?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.error.include-message=never
